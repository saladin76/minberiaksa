<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="locale-fonts.css">
<script>window.MIA_NS = ["certificates"];</script>
<script src="./i18n.js"></script>
<style>
  :root { --deep:#10212B; --navy:#132C38; --gold:#D39A27; --gold-2:#B8811C; --red:#A93428; --ivory:#FFFDF8; --sand:#F7F2EA; --muted:#52616B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sand); font-family: Cairo, system-ui, sans-serif; color: var(--deep); direction: rtl; }
  a { color: var(--gold-2); }
  a:hover { color: var(--red); }
  @media print {
    html, body { background: #fff; margin: 0; padding: 0; height: auto; }
    .no-print { display: none !important; }
    .cert-wrap { padding: 0 !important; min-height: 0 !important; }
    .cert-sheet { box-shadow: none !important; margin: 0 !important; width: 209mm !important; height: 295mm !important; max-width: none !important; aspect-ratio: auto !important; break-inside: avoid; page-break-inside: avoid; overflow: hidden; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    @page { size: A4 portrait; margin: 0; }
  }
</style>
</helmet>

<div class="cert-wrap" style="min-height: 100vh; padding: 28px 20px 44px;">

  <div class="cert-sheet" style="position: relative; width: 100%; max-width: 760px; margin: 0 auto; aspect-ratio: 1/1.414; background: #FFFEFB; box-shadow: 0 26px 70px rgba(16,33,43,.18); overflow: hidden;">

    <div aria-hidden="true" style="position: absolute; inset: 0; background:
      radial-gradient(circle at 50% 34%, rgba(255,255,255,.9) 0 38%, rgba(247,242,234,.55) 100%),
      repeating-conic-gradient(from 45deg at 0 0, rgba(211,154,39,.13) 0deg 90deg, transparent 90deg 180deg) 0 0/30px 30px,
      radial-gradient(circle at 0 0, transparent 68%, rgba(211,154,39,.16) 69% 71%, transparent 72%) 0 0/30px 30px,
      radial-gradient(circle at 100% 100%, transparent 68%, rgba(211,154,39,.16) 69% 71%, transparent 72%) 0 0/30px 30px,
      repeating-linear-gradient(45deg, rgba(211,154,39,.07) 0 1px, transparent 1px 15px),
      repeating-linear-gradient(-45deg, rgba(211,154,39,.07) 0 1px, transparent 1px 15px);"></div>
    <img src="assets/aqsa-dome-line.png" alt="" aria-hidden="true" style="position: absolute; inset-inline: 12%; bottom: 7%; width: 76%; height: auto; opacity: .09; pointer-events: none;">


    <div aria-hidden="true" style="position: absolute; inset: 2.4%; border: 2.5px solid var(--gold); "></div>
    <div aria-hidden="true" style="position: absolute; inset: 3.4%; border: 1px solid rgba(211,154,39,.55);"></div>
    <div aria-hidden="true" style="position: absolute; inset: 4.4%; border: 1px dashed rgba(211,154,39,.5);"></div>

    <div aria-hidden="true" style="position: absolute; top: 2.4%; inset-inline-start: 2.4%; width: 92px; height: 92px; border-top: 6px solid var(--gold); border-inline-start: 6px solid var(--gold);"></div>
    <div aria-hidden="true" style="position: absolute; top: 2.4%; inset-inline-end: 2.4%; width: 92px; height: 92px; border-top: 6px solid var(--gold); border-inline-end: 6px solid var(--gold);"></div>
    <div aria-hidden="true" style="position: absolute; bottom: 2.4%; inset-inline-start: 2.4%; width: 92px; height: 92px; border-bottom: 6px solid var(--gold); border-inline-start: 6px solid var(--gold);"></div>
    <div aria-hidden="true" style="position: absolute; bottom: 2.4%; inset-inline-end: 2.4%; width: 92px; height: 92px; border-bottom: 6px solid var(--gold); border-inline-end: 6px solid var(--gold);"></div>


    <div style="position: relative; height: 100%; padding: 8.5% 10% 7%; display: grid; grid-template-rows: auto auto 1fr auto; text-align: center;">

      <div style="display: grid; justify-items: center; gap: 12px;">
        <img src="assets/logo-horizontal.png" alt="مؤسسة منبر الأقصى الدولية" style="width: 30%; max-width: 190px; height: auto;">
        <span style="font-family: Amiri, serif; font-size: clamp(11px,1.5vw,15px); color: var(--deep);">بسم الله الرحمن الرحيم</span>
        <p style="margin: 0; width: 100%; font-family: Amiri, serif; font-size: clamp(10px,1.5vw,16px); font-weight: 700; line-height: 1.9; color: #7C2318; white-space: nowrap;">{{ verse }}</p>
      </div>

      <div style="display: grid; justify-items: center; gap: 16px; padding-top: 4%;">
        <h1 style="margin: 0; font-family: Amiri, serif; font-size: clamp(38px,7.2vw,78px); font-weight: 700; letter-spacing: .04em; color: var(--red); line-height: 1.7; white-space: nowrap;">{{ title }}</h1>
      </div>

      <div style="display: grid; align-content: center; justify-items: center; gap: 3.4%;">
        <div style="display: grid; justify-items: center; gap: 10px; width: 84%;">
          <span style="font-size: clamp(10px,1.4vw,14px); font-weight: 700; color: var(--muted); white-space: nowrap;">{{ nameLabel }}</span>
          <span style="display: grid; place-items: center; width: 100%; min-height: 46px; padding: 4px 6px; font-size: clamp(14px,2.5vw,27px); font-weight: 800; color: var(--deep); white-space: nowrap;">{{ donorName }}</span>
        </div>

        <p style="margin: 0; width: 94%; font-size: clamp(10px,1.5vw,15px); line-height: 2.1; color: var(--navy);">{{ body }}</p>


        <p style="margin: 1.8% 0 0; width: 100%; font-family: Amiri, serif; font-size: clamp(11px,1.82vw,20px); font-weight: 700; line-height: 1.9; color: #7C2318; white-space: nowrap;">{{ duaVerse }}</p>
        <p style="margin: 0; width: 92%; font-size: clamp(10px,1.62vw,17px); line-height: 2; color: var(--navy);">{{ duaText }}</p>
      </div>

      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 3%;">
        <img src="assets/cert-seal-alpha.png" alt="ختم المؤسسة" style="width: clamp(66px,9.4vw,110px); height: auto;">
        <div style="display: grid; justify-items: end; gap: 6px; text-align: end;">
          <span style="font-family: Amiri, serif; font-size: clamp(13px,2vw,22px); font-weight: 700; color: var(--gold-2); white-space: nowrap;">{{ motto }}</span>
          <span style="font-size: clamp(9px,1.2vw,13px); font-weight: 700; color: var(--navy); white-space: nowrap;">{{ orgName }}</span>
        </div>
      </div>

    </div>
  </div>

  <div class="no-print" style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding-top: 26px;">
    <button onClick="{{ print }}" style="display: inline-flex; align-items: center; gap: 9px; height: 48px; padding: 0 26px; border: 0; border-radius: 8px; background: var(--gold); color: var(--deep); font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer; white-space: nowrap; transition: filter .18s ease;" style-hover="filter: brightness(1.06);">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M8 14h8v7H8z"></path></svg>
      {{ tSavePdf }}
    </button>
    <a href="شهادة الشكر عرضية.dc.html" style="display: inline-flex; align-items: center; gap: 9px; height: 48px; padding: 0 24px; border-radius: 8px; border: 1px solid rgba(16,33,43,.16); background: #fff; font-size: 14px; font-weight: 800; color: var(--deep); text-decoration: none;" style-hover="border-color: var(--gold);">النسخة المعتمدة (عرضية)</a>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:1300},&quot;donorName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;بيانات المتبرع&quot;},&quot;dedication&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;دعمًا لفلسطين وأهلها الصامدين&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;بيانات المتبرع&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;شكر وتقدير&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;النصوص&quot;},&quot;verse&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;النصوص&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;النصوص&quot;},&quot;duaVerse&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;النصوص&quot;},&quot;duaText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;النصوص&quot;},&quot;motto&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;لنكن للقدس منبرًا&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;النصوص&quot;}}">
/*
 * شهادة الشكر — النسخة الطولية (نسخة بديلة / Alternate)
 * ------------------------------------------------------
 * حالة الاعتماد: نسخة بديلة (Alternate). النسخة الأساسية المعتمدة للإصدار
 * هي «شهادة الشكر عرضية.dc.html» (A4 عرضي) — وهي التي تُصدَر للمتبرع افتراضيًا.
 *
 * ربط الداشبورد:
 *   - لا تظهر هذه النسخة للمتبرع في الموقع العام؛ تُتاح داخل لوحة التحكم فقط
 *     ضمن إعدادات الشهادات كخيار «تخطيط طولي» يختاره المشرف عند الحاجة.
 *   - كلتا النسختين تقرآن نفس props (donorName / body / verse / duaVerse …)
 *     فيمكن للمشرف التعديل على نصوص أي منهما من لوحة التحكم بشكل مستقل،
 *     ويبقى التخطيط العرضي هو الافتراضي في مسار الإصدار الآلي والبريد.
 *
 * شهادة الشكر (Thank-you / Donation Certificate)
 * ------------------------------------------------
 * ما هي: مستند شكر رسمي يُصدَر للمتبرع بعد اكتمال التبرع، بديل حيّ (HTML)
 * لصورة القالب الجاهزة — يُملأ تلقائيًا ولا يحتاج تحرير صورة يدويًا.
 *
 * منطق العمل وربط الداشبورد:
 *   - كل الحقول props: donorName / amountText / refNo / issueDate / verse / body
 *     / dua / dedication + التسميات — تُحقن من الخادم بعد نجاح الدفع، ويمكن لفريق
 *     المحتوى تعديل النصوص الثابتة (الآية، الدعاء، الشعار) من لوحة التحكم دون كود.
 *   - refNo يجب أن يكون رقم الإيصال الفعلي الصادر من نظام الفوترة (بلا تكرار).
 *   - issueDate تاريخ الإصدار الفعلي من الخادم — لا تاريخ عميل.
 *   - الطباعة: الصفحة مهيأة A4 عمودي بلا هوامش؛ زر «حفظ PDF» يستدعي طباعة
 *     المتصفح. للتوليد الآلي (إرسال بالبريد) يُصيَّر نفس القالب على الخادم.
 *   - تُستدعى من «نجاح التبرع» و«حساب المتبرع» بتمرير نفس props.
 */
class Component extends DCLogic {
  /* النصوص الثابتة من حزمة certificates؛ الآيات تبقى بالعربية. */
  tr(key, arFallback) {
    const g = window.MIA_I18N;
    return (g && g.t("certificates", key)) || arFallback;
  }
  componentDidMount() {
    this._onLang = () => this.forceUpdate();
    window.addEventListener("mia:langchange", this._onLang);
    if (window.MIA_I18N && window.MIA_I18N.load) window.MIA_I18N.load().then(() => this.forceUpdate());
  }
  componentWillUnmount() { window.removeEventListener("mia:langchange", this._onLang); }
  renderVals() {
    const p = this.props || {};
    return {
      verse: p.verse || "﴿مَثَلُ الَّذِينَ يُنفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ كَمَثَلِ حَبَّةٍ أَنبَتَتْ سَبْعَ سَنَابِلَ فِي كُلِّ سُنبُلَةٍ مِّائَةُ حَبَّةٍ﴾",
      title: p.title || this.tr("thanksTitle", "شكر وتقدير"),
      nameLabel: p.nameLabel || this.tr("nameLabel", "تُمنَح هذه الشهادة تقديرًا لـ"),
      tSavePdf: this.tr("savePdfCert", "حفظ الشهادة PDF"),
      donorName: p.donorName || "",
      body: p.body || this.tr("thanksBody", "تتشرّف مؤسسة منبر الأقصى الدولية بأن تُسجّل لكم هذا الشكر والتقدير على ما بذلتموه ابتغاءَ وجه الله تعالى، نصرةً لأهل القدس وفلسطين، ودعمًا لصمودهم في مشاريع موثّقة ومتابَعة. أثبتنا اسمكم في سجلّ الساعين إلى إسناد الرباط حول المسجد الأقصى المبارك، ونسأل الله أن يتقبّله بقبولٍ حسن، وأن يجعله ذخرًا لكم في ميزانِ حسناتكم."),

      duaVerse: p.duaVerse || "﴿وَمَا تُقَدِّمُوا لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ اللَّهِ﴾",
      duaText: p.duaText || this.tr("duaText", "بارك الله لكم فيما أعطيتم، وجمعنا وإياكم في باحات المسجد الأقصى محرَّرًا."),
      motto: p.motto || this.tr("motto", "لنكن للقدس منبرًا"),
      orgName: p.orgName || this.tr("orgName", "مؤسسة منبر الأقصى الدولية"),
      print: () => window.print(),
    };
  }
}

</script>
</body>
</html>
