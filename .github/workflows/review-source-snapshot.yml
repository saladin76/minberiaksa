name: Review source snapshot
on:
  pull_request:
    branches: ['feat/bank-statements-workspace-20261103']
    paths: ['.github/workflows/review-source-snapshot.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: git archive --format=tar.gz --output=review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: review-source.tar.gz
          retention-days: 1
