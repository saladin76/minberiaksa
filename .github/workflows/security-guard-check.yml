name: Security guard verification
on:
  push:
    branches:
      - feature/donation-abuse-guard-20261109
  workflow_dispatch:
jobs:
  guard-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run isolated security guard tests
        run: node --import tsx --test tests/integration-settings/donation-abuse-policy.test.ts tests/integration-settings/payment-initiation-budget.test.ts tests/integration-settings/emergency-maintenance-contract.test.ts tests/integration-settings/donation-fraud-persistence-contract.test.ts tests/integration-settings/verified-gateway-decline-wiring.test.ts tests/integration-settings/payfor-authentication.test.ts
