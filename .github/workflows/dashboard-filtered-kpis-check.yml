name: Dashboard filtered KPI regression
on:
  push:
    branches:
      - fix/dashboard-filtered-primary-kpis-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-kpi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma clients
        run: |
          npx prisma generate
          npx prisma generate --schema prisma/integration-settings.schema.prisma
      - name: Filtered KPI regression
        run: node --import tsx --test tests/integration-settings/dashboard-scoped-period.test.ts
      - name: TypeScript integration release
        run: npm run typecheck:integration-release
