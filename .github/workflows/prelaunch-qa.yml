name: Prelaunch responsive and load QA

on:
  pull_request:
    branches: [main]
    paths:
      - "e2e/prelaunch-responsive.spec.ts"
      - "tests/prelaunch/**"
      - ".github/workflows/prelaunch-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    name: Responsive sitemap sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_BASE_URL: https://minberiaksa.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/prelaunch-responsive.spec.ts --project=chromium --workers=4
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-responsive-report
          path: |
            e2e/.artifacts/report
            e2e/.artifacts/test-results
          if-no-files-found: ignore

  load:
    name: Light read-only API load check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOAD_BASE_URL: https://minberiaksa.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/prelaunch/load-readonly.test.ts
