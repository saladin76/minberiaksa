name: Pattern Visual QA

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - public/assets/patterns/**
      - styles/pattern-background.css
      - styles/pattern-asset-source.css
      - app/layout.tsx
      - components/brand/pattern-background.tsx
      - config/visual-assets.ts
      - tests/pattern-background.spec.ts
      - scripts/pattern-source/**
      - scripts/write-pattern-svg.mjs
      - scripts/generate-pattern-assets.mjs
      - scripts/capture-pattern-qa.mjs
      - playwright.config.ts
      - package.json
      - .github/workflows/pattern-visual-qa.yml

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate high-resolution seamless assets
        id: generate
        continue-on-error: true
        run: |
          mkdir -p artifacts/generation-debug artifacts/pattern-diff
          npm run generate:pattern > artifacts/generation-debug/generate.log 2>&1
      - name: Record generated asset differences
        if: steps.generate.outcome == 'success'
        run: |
          git status --short -- public/assets/patterns > artifacts/pattern-diff/status.txt
          git diff -- public/assets/patterns > artifacts/pattern-diff/generated-assets.diff
          if git diff --quiet -- public/assets/patterns; then
            echo "PATTERN_DIFF=false" >> "$GITHUB_ENV"
          else
            echo "PATTERN_DIFF=true" >> "$GITHUB_ENV"
          fi
      - name: Upload generation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-generation-debug-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/generation-debug
            artifacts/pattern-diff
            public/assets/patterns/aqsa-white-pattern.svg
            public/assets/patterns/aqsa-white-pattern.png
            public/assets/patterns/aqsa-white-pattern.webp
          if-no-files-found: warn
          retention-days: 3
      - name: Stop when generation failed
        if: steps.generate.outcome == 'failure'
        run: |
          cat artifacts/generation-debug/generate.log
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        id: production-build
        continue-on-error: true
        run: |
          mkdir -p artifacts/build-debug
          npm run build > artifacts/build-debug/build.log 2>&1
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-build-debug-${{ github.event.pull_request.head.sha }}
          path: artifacts/build-debug
          if-no-files-found: error
          retention-days: 3
      - name: Stop when production build failed
        if: steps.production-build.outcome == 'failure'
        run: |
          cat artifacts/build-debug/build.log
          exit 1
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/minberi-next.log 2>&1 &
          echo $! > /tmp/minberi-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/minberi-next.log
          exit 1
      - name: Run pattern safeguards
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          mkdir -p artifacts/test-debug
          npm run test:pattern | tee artifacts/test-debug/playwright.log
      - name: Upload safeguard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-test-debug-${{ github.event.pull_request.head.sha }}
          path: artifacts/test-debug
          if-no-files-found: error
          retention-days: 3
      - name: Capture local production screenshots
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run capture:pattern
      - name: Record asset metadata
        run: |
          printf 'Local production build screenshots from source commit: %s\n' "${{ github.event.pull_request.head.sha }}" > artifacts/pattern-qa/assets.txt
          file public/assets/patterns/aqsa-white-pattern.svg public/assets/patterns/aqsa-white-pattern.png public/assets/patterns/aqsa-white-pattern.webp >> artifacts/pattern-qa/assets.txt
          stat -c '%n %s bytes' public/assets/patterns/aqsa-white-pattern.svg public/assets/patterns/aqsa-white-pattern.png public/assets/patterns/aqsa-white-pattern.webp >> artifacts/pattern-qa/assets.txt
      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-visual-qa-${{ github.event.pull_request.head.sha }}
          path: artifacts/pattern-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Require review when generated assets differ
        if: env.PATTERN_DIFF == 'true'
        run: |
          echo "Generated pattern assets differ from the committed files. Review the uploaded diff and generated artifacts."
          exit 1
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/minberi-next.pid ]; then kill "$(cat /tmp/minberi-next.pid)" || true; fi
