name: PR6 Final Gate QA

on:
  push:
    branches:
      - qa/pr6-final-gate-77a7bcf
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: 77a7bcf5139c064c8711b445074648171095ba42
  CHECKOUT_MODE: explicit-head-sha
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

jobs:
  job-a:
    name: A - Global Visual Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout product source explicitly
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: product
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout QA harness
        uses: actions/checkout@v4
        with:
          ref: qa/pr6-final-gate-77a7bcf
          path: qa
          fetch-depth: 1
          persist-credentials: false
      - name: Decode and validate QA harness
        shell: bash
        run: |
          base64 -d qa/scripts/pr6-final-gate.mjs.gz.b64 | gzip -d > /tmp/pr6-final-gate.mjs
          node --check /tmp/pr6-final-gate.mjs
      - name: Prove exact source and clean tree
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git -C product rev-parse HEAD)"
          TREE_SHA="$(git -C product rev-parse 'HEAD^{tree}')"
          STATUS="$(git -C product status --porcelain)"
          test "$HEAD_SHA" = "$SOURCE_COMMIT"
          test -z "$STATUS"
          git -C product diff --exit-code
          git -C product diff --cached --exit-code
          printf 'HEAD: %s\nTREE: %s\nSTATUS: %s\n' "$HEAD_SHA" "$TREE_SHA" "${STATUS:-CLEAN}" | tee source-proof.txt
          echo "SOURCE_TREE=$TREE_SHA" >> "$GITHUB_ENV"
          echo "WORKING_TREE_CLEAN=true" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        working-directory: product
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Production build
        shell: bash
        run: |
          mkdir -p artifacts/job-a/build
          set -o pipefail
          npm --prefix product run build 2>&1 | tee artifacts/job-a/build/build.log
      - name: Start production server
        shell: bash
        run: |
          npm --prefix product run start -- -p 3000 > /tmp/pr6-job-a-server.log 2>&1 &
          echo $! > /tmp/pr6-job-a-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pr6-job-a-server.log
          exit 1
      - name: Run Job A harness
        env:
          QA_JOB: job-a
          PRODUCT_ROOT: product
          QA_OUTPUT: artifacts/job-a
        run: node /tmp/pr6-final-gate.mjs
      - name: Save source proof
        if: always()
        run: cp source-proof.txt artifacts/job-a/source-proof.txt || true
      - name: Upload Job A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6-final-gate-job-a-${{ env.SOURCE_COMMIT }}
          path: artifacts/job-a
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Stop server
        if: always()
        run: if [ -f /tmp/pr6-job-a-server.pid ]; then kill "$(cat /tmp/pr6-job-a-server.pid)" || true; fi

