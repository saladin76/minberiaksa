name: PR6 Phase 4 QA

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - app/layout.tsx
      - components/basket/**
      - components/currency/**
      - components/homepage/**
      - components/project-detail/**
      - components/recurring/**
      - components/selectors/**
      - components/ui/language-selector.tsx
      - components/waqf/**
      - components/zakat/**
      - config/navigation.ts
      - scripts/pr6-phase4-job.mjs
      - .github/workflows/basket-visual-qa.yml

permissions:
  contents: read

jobs:
  phase4:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cart-currency
            label: Job A - Cart and Currency
          - id: footer-accessibility
            label: Job B - Footer and Accessibility
          - id: technical-links
            label: Job C - Technical Text and Public Links
          - id: donation-regression
            label: Job D - Donation Tool Regression
          - id: smoke
            label: Smoke - Build and Core Routes
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "artifacts/phase4/${{ matrix.id }}/build"
          npm run build 2>&1 | tee "artifacts/phase4/${{ matrix.id }}/build/build.log"
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3000 > "/tmp/minberi-${{ matrix.id }}.log" 2>&1 &
          echo $! > "/tmp/minberi-${{ matrix.id }}.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "/tmp/minberi-${{ matrix.id }}.log"
          exit 1
      - name: Run phase 4 job
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PHASE4_JOB: ${{ matrix.id }}
          PHASE4_OUTPUT: artifacts/phase4/${{ matrix.id }}
        run: |
          set -o pipefail
          node scripts/pr6-phase4-job.mjs 2>&1 | tee "artifacts/phase4/${{ matrix.id }}/run.log"
      - name: Upload phase 4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-${{ matrix.id }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/phase4/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f "/tmp/minberi-${{ matrix.id }}.pid" ]; then kill "$(cat "/tmp/minberi-${{ matrix.id }}.pid")" || true; fi
